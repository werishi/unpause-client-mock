name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

# Least-privilege default: every job inherits this unless it overrides.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: verify
    # Guard: only push an image when we are on the default branch.
    # Without this, a workflow_dispatch from any branch would overwrite :latest
    # with unmerged code. Both branch names listed so a rename from main to
    # master (or vice versa) does not silently stop publishing.
    # A pull_request run's github.ref is refs/pull/<N>/merge — it never matches
    # either pattern, so pull requests never trigger publish.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Literal image name rather than ${{ github.repository }}:
          # - guarantees lowercase (GHCR requirement)
          # - prevents a fork or transfer from silently pushing to a different registry path
          images: ghcr.io/werishi/unpause-client-mock
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
          # metadata-action includes org.opencontainers.image.source, which links
          # the GHCR package to this repository so it inherits the repo's private
          # visibility — no extra step needed to keep the image private.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache keeps repeat builds fast without an external registry.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single platform — linux/amd64 is the runner default.
          # No QEMU/multi-arch: ARM was not requested and emulated Next.js
          # builds are several times slower.
          platforms: linux/amd64
