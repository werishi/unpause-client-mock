server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Next's static export always emits out/404.html; serve it for unknown paths so
    # users see the app's own 404 page rather than nginx's default.
    error_page 404 /404.html;

    # Explicit MIME type for .webmanifest — nginx's default mime.types omits it.
    # Without this, browsers log a type warning and may decline to install the manifest.
    types {
        application/manifest+json  webmanifest;
    }

    # Content-hashed assets are safe to cache indefinitely.
    # HTML files carry no Cache-Control header so a redeployed image is seen immediately.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
